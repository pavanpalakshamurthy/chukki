<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chukki demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #faf9f5; --ink: #141413; --line: rgba(20,20,19,.15); }
    :root[data-theme="dark"] { --bg: #1b1a19; --ink: #f0eee6; --line: rgba(240,238,230,.18); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 Poppins, system-ui, sans-serif; }
    body { display: grid; grid-template-rows: 1fr auto; }
    #stage { width: 100%; height: 100%; display: block; touch-action: none; }
    footer { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
    #cap { flex: 1; font-family: Lora, Georgia, serif; font-size: 16px; }
    button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    #n { font-variant-numeric: tabular-nums; opacity: .7; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <footer>
    <button id="prev" aria-label="Previous step">‹</button>
    <span id="n"></span>
    <button id="next" aria-label="Next step">›</button>
    <span id="cap"></span>
    <button id="theme">Theme</button>
  </footer>

  <!-- core, then kits, then the rest of core, then boot (order matters) -->
  <script src="../packages/core/src/expr.js"></script>
  <script src="../packages/core/src/scene.js"></script>
  <script src="../packages/core/src/render.js"></script>
  <script src="../packages/core/src/objects.js"></script>
  <script src="../packages/kit-numline/src/numline.js"></script>
  <script src="../packages/kit-plots/src/plots.js"></script>
  <script src="../packages/kit-systems/src/sysviz.js"></script>
  <script src="../packages/kit-circuits/src/circuitviz.js"></script>
  <script src="../packages/core/src/lesson_kit.js"></script>
  <script src="../packages/core/src/three.js"></script>
  <script src="../packages/core/src/anim.js"></script>
  <script src="../packages/core/src/interact.js"></script>
  <script src="../packages/core/src/boot.js"></script>
  <script src="shower.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
    Chukki.mount($('stage'), { theme }).play(window.SHOWER);
    const sync = () => { $('n').textContent = `${Chukki.step() + 1}/${Chukki.steps()}`; $('cap').textContent = Chukki.caption(); };
    Chukki.on('step', sync); sync();
    $('prev').onclick = () => Chukki.prev();
    $('next').onclick = () => Chukki.next();
    $('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = theme; Chukki.setTheme(theme); };
    addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') Chukki.next(); if (e.key === 'ArrowLeft') Chukki.prev(); });
  </script>
</body>
</html>
